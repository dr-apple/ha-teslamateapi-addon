name: TeslaMate API
version: "1.25.0"
slug: teslamateapi
description: REST API for TeslaMate data using tobiasehlert/teslamateapi.
url: https://github.com/tobiasehlert/teslamateapi
arch:
  - amd64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8080
panel_icon: mdi:api
ports:
